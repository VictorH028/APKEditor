name: Build GUI Jar

on:
  push:
    branches: [ "master", "UI" ]
  pull_request:
    branches: [ "master", "UI" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build GUI fat jar
        run: |
          chmod +x gradlew
          ./gradlew clean guiFatJar --no-daemon
          ls -lh build/libs

      - name: Upload GUI jar
        uses: actions/upload-artifact@v4
        with:
          name: APKEDITOR-GUI
          path: build/libs/*-gui.jar
          if-no-files-found: error
