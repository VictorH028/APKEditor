name: Build Beta Jar

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: '8'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - name: Resolve app version
        run: echo "APP_VERSION=$(./gradlew -q properties | awk '/^version:/{print $2}')" >> "$GITHUB_ENV"
      - name: Build with Gradle
        run: ./gradlew fatJar
      - uses: actions/upload-artifact@v7
        with:
          name: APKEditor-${{ env.APP_VERSION }}
          path: build/libs/APKEditor-${{ env.APP_VERSION }}.jar
          if-no-files-found: error
          archive: false
